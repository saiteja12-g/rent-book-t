<!doctype html>

<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Rent Book</title>
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* LAYOUT: one column for a phone, a little illustrated street on top, tabs along the bottom, sheets slide up for every form.
   Colours: pale neem ground, peacock teal for the money hero, marigold for warmth, clay for rent still owed, green tick for paid.
   Type: Baloo 2 (an Indian display face) for headings and big rupee figures, Schibsted Grotesk for reading. */
:root{
  --bg:#eef3ef;--panel:#ffffff;--ink:#1c2a26;--muted:#53625d;--line:#d9e3de;--soft:#e4ece8;
  --teal:#0f6e6a;--paid:#1b7a4b;--part:#965800;--clay:#b5432a;--mari:#e59a1c;--onink:#ffffff;
  --hero:#0d504c;--hero-ink:#fbf6ea;--hero-mute:#cfe5df;--meter:#7ee0b4;
  --ghost:#c9d7d1;--biz-soft:#fbeccd;--fam-soft:#dcefdc;
  --wall:#f6dcab;--wall2:#f3e7d3;--roof:#c8532f;--roof2:#9b3c20;--door:#0f6e6a;--glass:#bfe2e6;--ground:#d3e2d8;--leaf:#4f9a45;--cloud:#ffffff;--board:#24312d;--a-cream:#fff6e3;
  --f-display:"Baloo 2",ui-rounded,"Schibsted Grotesk",system-ui,-apple-system,sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101917;--panel:#1a2522;--ink:#eaf2ee;--muted:#a3b5ae;--line:#2d3c38;--soft:#22302c;
  --teal:#4cc7bb;--paid:#57d398;--part:#f2b04a;--clay:#ff8a66;--mari:#f2ac3a;--onink:#101917;
  --hero:#0b3734;--hero-ink:#fbf3e2;--hero-mute:#b8d8d0;--meter:#6fd9aa;
  --ghost:#3a4b46;--biz-soft:#3b3020;--fam-soft:#1f3423;
  --wall:#b48d5d;--wall2:#8f7d66;--roof:#c8603a;--roof2:#8f3a22;--door:#2a8f88;--glass:#5f97a0;--ground:#23332e;--leaf:#6db35c;--cloud:#2e3e3a;--board:#0b1210;--a-cream:#d9c9a8;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101917;--panel:#1a2522;--ink:#eaf2ee;--muted:#a3b5ae;--line:#2d3c38;--soft:#22302c;
  --teal:#4cc7bb;--paid:#57d398;--part:#f2b04a;--clay:#ff8a66;--mari:#f2ac3a;--onink:#101917;
  --hero:#0b3734;--hero-ink:#fbf3e2;--hero-mute:#b8d8d0;--meter:#6fd9aa;
  --ghost:#3a4b46;--biz-soft:#3b3020;--fam-soft:#1f3423;
  --wall:#b48d5d;--wall2:#8f7d66;--roof:#c8603a;--roof2:#8f3a22;--door:#2a8f88;--glass:#5f97a0;--ground:#23332e;--leaf:#6db35c;--cloud:#2e3e3a;--board:#0b1210;--a-cream:#d9c9a8;
  color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 var(--f-body);overflow-x:clip;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
body.noscroll{overflow:hidden}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{max-width:760px;margin:0 auto;padding-block:10px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
header.top .ttl{padding-bottom:10px}
header.top h1{margin:0;font:800 30px/1 var(--f-display);letter-spacing:-.01em;color:var(--ink)}
header.top .today{color:var(--muted);font-size:15px;margin-top:4px}
header.top .scene{width:min(48vw,270px);height:auto;flex:none;display:block}
main{max-width:760px;margin:0 auto;padding-block:4px 24px}
h2{font:800 30px/1.1 var(--f-display);margin:0;text-wrap:balance}
h3{font:700 22px/1.2 var(--f-display);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mari);outline-offset:2px}
.btn{min-height:54px;padding:10px 18px;border-radius:16px;border:2px solid var(--ink);background:var(--panel);font-weight:700;font-size:18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--onink)}
.btn.paid{border-color:var(--paid);color:var(--paid);background:transparent}
.btn.part{border-color:var(--part);color:var(--part);background:transparent}
.btn.warn{border-color:var(--clay);color:var(--clay);background:transparent}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.link{background:none;border:0;padding:10px 0;min-height:44px;font-weight:700;color:var(--teal);text-decoration:underline;text-underline-offset:3px}
.card{background:var(--panel);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 1px 0 var(--line)}
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:16px 18px 20px;margin:6px 0}
.hero .coins{position:absolute;right:-6px;bottom:-8px;width:120px;height:auto;opacity:.95;pointer-events:none}
.hero>*:not(.coins){position:relative}
.hero .lbl{color:var(--hero-mute);font-size:17px}
.big{font:800 clamp(42px,12.5vw,60px)/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap;margin-top:6px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mnav h2{font-size:24px;text-align:center;flex:1}
.mnav button{width:50px;height:50px;border-radius:50%;border:2px solid currentColor;background:transparent;font-size:26px;font-weight:700;display:grid;place-items:center;color:inherit;flex:none}
.meter{height:18px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden;margin:14px 0 10px;max-width:calc(100% - 70px)}
.meter i{display:block;height:100%;background:var(--meter);border-radius:9px}
.facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:17px;max-width:calc(100% - 80px)}
.facts b{font:800 22px var(--f-display)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted);vertical-align:middle;white-space:nowrap}
.tag.biz{background:var(--biz-soft);color:var(--part)}
.tag.fam{background:var(--fam-soft);color:var(--paid)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cardhead .mini{width:40px;height:30px;flex:none}
.cardhead .hl{display:flex;align-items:center;gap:10px}
.trow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:800 19px var(--f-display);background:hsl(var(--h) 62% 86%);color:hsl(var(--h) 50% 24%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:hsl(var(--h) 30% 28%);color:hsl(var(--h) 70% 88%)}}
:root[data-theme="dark"] .av{background:hsl(var(--h) 30% 28%);color:hsl(var(--h) 70% 88%)}
.trow .nm{font-weight:700;font-size:19px;overflow-wrap:anywhere}
.trow .sub{color:var(--muted);font-size:16px}
.trow .btn{min-width:136px}
.pill{font-size:15px;font-weight:700;white-space:nowrap}
.st-paid{color:var(--paid)}.st-part{color:var(--part)}.st-over{color:var(--clay)}.st-due{color:var(--ink)}.st-up{color:var(--muted)}
.banner{background:var(--biz-soft);border:2px dashed var(--mari);border-radius:16px;padding:12px 16px;margin:10px 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin:14px 0}
.tile{background:var(--panel);border-radius:22px;padding:0;border:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 0 var(--line);width:100%}
.tile-art{display:flex;justify-content:center;align-items:flex-end;height:112px;padding-top:10px}
.tile.biz .tile-art{background:var(--biz-soft)}
.tile.fam .tile-art{background:var(--fam-soft)}
.tile-art svg{height:100px;width:auto}
.tile-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:8px}
.tile .amt{font-size:16px;color:var(--muted)}
.tile .amt b{color:var(--ink);font:800 22px var(--f-display)}
.empty{text-align:center;padding:24px 18px 28px}
.empty .ill{width:min(220px,70%);height:auto;display:block;margin:0 auto 10px}
.empty p{color:var(--muted);margin:8px 0 18px}
.back{background:none;border:0;font-weight:700;padding:10px 0;min-height:44px;font-size:18px;color:var(--teal)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .r{text-align:right;white-space:nowrap}
.list button.rowbtn{all:unset;display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;cursor:pointer;min-height:40px}
.list button.rowbtn:focus-visible{outline:3px solid var(--mari);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.actions .btn{flex:1 1 150px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}
.kpi{background:var(--panel);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .ic{width:30px;height:30px;margin-bottom:4px}
.kpi small{display:block;color:var(--muted);font-size:15px;line-height:1.3}
.kpi b{font:800 clamp(20px,5.8vw,28px)/1.15 var(--f-display);white-space:nowrap}
.fig{position:relative;height:240px;margin-top:8px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.fig text{fill:var(--muted);font-size:12px;font-family:var(--f-body)}
.b-exp{fill:var(--ghost)}.b-got{fill:var(--teal)}.b-sel{fill:var(--mari)}.gl{stroke:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hb{margin:12px 0}
.hb .top{display:flex;justify-content:space-between;gap:10px;font-size:17px}
.hb .top span:first-child{display:flex;align-items:center;gap:8px;min-width:0}
.hb .top svg{width:30px;height:24px;flex:none}
.hb .trk{height:14px;border-radius:7px;background:var(--soft);margin-top:6px;position:relative;overflow:hidden}
.hb .trk s{position:absolute;inset:0 auto 0 0;background:var(--ghost);border-radius:7px}
.hb .trk i{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:7px}
.split{display:flex;height:24px;border-radius:12px;overflow:hidden;margin:10px 0 6px;background:var(--soft)}
.split i{display:block;height:100%}
.detail{min-height:48px;font-size:17px;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--soft)}
.allpaid{display:flex;align-items:center;gap:14px}
.allpaid svg{width:72px;height:72px;flex:none}
/* sheet */
.shwrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--panel);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@media(prefers-reduced-motion:reduce){.sheet-in{animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.sh-head h2{font-size:26px}
.x{width:46px;height:46px;border-radius:50%;border:0;background:var(--soft);font-size:26px;line-height:1;flex:none}
label.f{display:block;margin:14px 0 0;font-weight:700;font-size:17px}
label.f small{font-weight:400;color:var(--muted)}
.f input,.f select,.f textarea{display:block;width:100%;margin-top:6px;min-height:54px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:19px;-webkit-appearance:none;appearance:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--teal);outline:none}
.rs{position:relative;display:block;margin-top:6px}
.rs::before{content:"₹";position:absolute;left:14px;top:50%;transform:translateY(-50%);font:800 22px var(--f-display);color:var(--muted);pointer-events:none}
.rs input{margin-top:0;padding-left:38px;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.seg label{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;border:2px solid var(--line);border-radius:16px;font-weight:700;text-align:center;padding:8px 6px;cursor:pointer}
.seg label svg{width:64px;height:48px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){border-color:var(--teal);background:var(--soft);box-shadow:inset 0 0 0 2px var(--teal)}
.seg label:has(input:focus-visible){outline:3px solid var(--mari)}
.hint{font-size:16px;color:var(--muted);margin-top:6px;min-height:22px}
.sh-actions{display:grid;gap:10px;margin-top:20px}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:700;color:var(--muted);border-radius:14px}
nav.tabs button[aria-current=page]{color:var(--teal);background:var(--soft)}
nav.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
.note{color:var(--muted);font-size:16px}
.toast button{background:none;border:0;color:var(--mari);font-weight:800;text-decoration:underline;margin-left:12px;padding:6px 4px;min-height:44px}
.banner.ask{display:grid;gap:10px;justify-content:stretch;margin-top:16px}
@media(max-width:420px){.trow{grid-template-columns:48px minmax(0,1fr)}.trow .btn{grid-column:1/-1;width:100%}.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:first-child{grid-column:1/-1}.hero .coins{width:96px}}
</style>
</head>

<script>
/* Rent Book practice copy: stands in for claude.ai's online storage.
   Everything is kept on this phone only (localStorage). No sign-in, nothing sent anywhere. */
(function(){
  var KEY='rentbook-practice-v1';
  var COLS=['props','tenants','pays','settings'];
  var store=null, persistent=true;
  function empty(){var o={seeded:false};COLS.forEach(function(c){o[c]={}});return o}
  function clone(v){return v==null?v:JSON.parse(JSON.stringify(v))}
  function load(){
    try{var raw=window.localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);COLS.forEach(function(c){if(!o[c]||typeof o[c]!=='object')o[c]={}});return o}}catch(e){}
    return null}
  function save(){
    if(!persistent)return;
    try{window.localStorage.setItem(KEY,JSON.stringify(store))}catch(e){persistent=false;warn()}}
  function warn(){
    var show=function(){var b=document.getElementById('practice-warn');if(b)b.hidden=false};
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show);else show()}
  try{var probe='__rb_probe';window.localStorage.setItem(probe,'1');window.localStorage.removeItem(probe)}catch(e){persistent=false;warn()}
  store=load();
  if(!store){store=empty();seed(store);save()}

  /* ---------- practice data, dated around this month ---------- */
  function seed(s){
    var now=new Date(),Y=now.getFullYear(),M=now.getMonth();
    function ym(back){var d=new Date(Y,M-back,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
    function day(back,dd){return ym(back)+'-'+String(dd).padStart(2,'0')}
    s.props.p_shops={name:'Main Road Shops',type:'business',address:'Main Road, near the bus stand',createdAt:day(0,1),sample:true};
    s.props.p_house={name:'Gandhi Nagar House',type:'family',address:'12, 3rd Cross, Gandhi Nagar',createdAt:day(0,1),sample:true};
    var T=[
      {id:'t_ravi',p:'p_shops',name:'Ravi Kumar (kirana shop)',phone:'',startBack:18,rents:[[18,25000,''],[6,27500,'10% yearly hike']],note:'Cash'},
      {id:'t_meena',p:'p_shops',name:'Meena Tailors',phone:'',startBack:10,rents:[[10,15000,'']],note:'UPI',partLast:9000},
      {id:'t_lakshmi',p:'p_house',name:'Lakshmi Devi',phone:'',startBack:14,rents:[[14,18000,''],[2,19000,'Hike after 1 year']],note:'Bank transfer',notes:'Ground floor'},

    T.forEach(function(t){

      s.tenants[t.id]=doc;

        if(b===0&&t.id!=='t_ravi')continue;            /* this month: only Ravi has paid so far */
        var m=ym(b),amt=0;

        if(b===1&&t.partLast)amt=t.partLast;           /* Meena paid part of last month */
        s.pays[t.id+'_'+m]={tenantId:t.id,propertyId:t.p,month:m,amount:amt,paidOn:day(b,5),note:t.note,sample:true};
      }
    });

  }

  /* ---------- the storage API the app expects ---------- */
  var listeners=[];
  function split(path){var i=path.indexOf('/');return [path.slice(0,i),path.slice(i+1)]}
  function newId(){var c='abcdefghijklmnopqrstuvwxyz0123456789',s='';for(var i=0;i<20;i++)s+=c[Math.floor(Math.random()*c.length)];return s}
  function err(code,msg){var e=new Error(msg);e.code=code;return e}
  var META={fromCache:false,hasPendingWrites:false};
  function docSnap(col,id){var d=store[col]&&store[col][id];return {id:id,exists:!!d,data:function(){return d?clone(d):undefined},metadata:META}}
  function colSnap(col){var docs=Object.keys(store[col]).map(function(id){var d=store[col][id];return {id:id,exists:true,data:function(){return clone(d)}}});
    return {docs:docs,size:docs.length,empty:!docs.length,metadata:META}}
  function notify(col){listeners.forEach(function(l){if(l.col===col)deliver(l)})}
  function deliver(l){Promise.resolve().then(function(){if(!l.on)return;try{l.next(l.id==null?colSnap(l.col):docSnap(l.col,l.id))}catch(e){setTimeout(function(){throw e})}})}
  function listen(col,id,next){var l={col:col,id:id,next:next,on:true};listeners.push(l);deliver(l);
    return function(){l.on=false;listeners=listeners.filter(function(x){return x!==l})}}
  function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v)}
  function merge(a,b){Object.keys(b).forEach(function(k){if(isObj(b[k])&&isObj(a[k]))merge(a[k],b[k]);else a[k]=clone(b[k])})}
  function write(col,fn){fn();save();notify(col);return Promise.resolve()}
  function docRef(col,id){
    return {id:id,path:col+'/'+id,
      get:function(){return Promise.resolve(docSnap(col,id))},
      set:function(d){return write(col,function(){store[col][id]=clone(d)})},
      update:function(d){if(!store[col][id])return Promise.reject(err('invalid_argument','Document does not exist'));

      delete:function(){return write(col,function(){delete store[col][id]})},
      onSnapshot:function(next){return listen(col,id,next)}}}
  var db={
    collection:function(col){if(!store[col])store[col]={};
      return {path:col,doc:function(id){return docRef(col,id||newId())},onSnapshot:function(next){return listen(col,null,next)}}},
    doc:function(path){var p=split(path);if(!store[p[0]])store[p[0]]={};return docRef(p[0],p[1])}};
  var user={can:function(){return Promise.resolve(true)},id:function(){return Promise.resolve(null)}};

  /* another tab on the same phone changed the data */
  window.addEventListener('storage',function(e){if(e.key!==KEY)return;var o=load();if(o){store=o;COLS.forEach(notify)}});

  window.claude={use:function(name){return Promise.resolve(name==='db'?db:name==='user'?user:null)}};
  window.rentBookPractice={reset:function(){store=empty();seed(store);save();COLS.forEach(notify)}};
})();

let fmtC;try{fmtC=new Intl.NumberFormat(LOC,{style:'currency',currency:'INR',notation:'compact',maximumFractionDigits:1})}catch(e){fmtC=fmtR}

const dName=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||''))return '';const [y,m,dd]=d.split('-').map(Number);return new Intl.DateTimeFormat(LOC,{day:'numeric',month:'short',year:'numeric'}).format(new Date(y,m-1,dd))};
/* Amounts are whole rupees. "Rs. 18,000", "₹1,25,000.50" and "18000/-" all work; anything with a minus sign is not an amount (returns 0, so the form asks again). */

/* ---------- rent logic ---------- */
const startM=t=>(t.start||'0000-01').slice(0,7);
const endM=t=>t.end?t.end.slice(0,7):'9999-12';
const active=(t,m)=>m>=startM(t)&&m<=endM(t);
/* Rent history: the old `rents` array (never rewritten), then each rent_YYYY-MM key on top of it.
   A key set to null removes that month; an object sets it. Keys win over the array. */
const RENT_KEY=/^rent_(\d{4}-\d{2})$/;
const rents=t=>{const m=new Map();for(const r of Array.isArray(t.rents)?t.rents:[])if(r&&r.from)m.set(r.from,r);
  for(const k of Object.keys(t)){const x=RENT_KEY.exec(k);if(!x)continue;const v=t[k];if(v===null)m.delete(x[1]);else if(v&&typeof v==='object')m.set(x[1],{...v,from:x[1]})}
  return [...m.values()].sort((a,b)=>a.from<b.from?-1:1)};
const rentAt=(t,m)=>{const rs=rents(t);let a=rs.length?Number(rs[0].amount)||0:0;for(const r of rs)if(r.from<=m)a=Number(r.amount)||0;return a};

/* ---------- views ---------- */
function sampleBanner(){return hasSample()?`<div class="banner"><span>You are looking at <b>sample data</b> for practice.</span>${act('clear-sample','Remove sample data','link')}</div>`:''}

function vMonth(){

   <div class="lbl">Total received this month</div>
   <div class="big num">${esc(money(T.got))}</div><div class="lbl">of <span class="num">${esc(money(T.exp))}</span> expected · ${pct}%</div>
   <div class="meter" role="img" aria-label="${pct}% received"><i style="width:${pct}%"></i></div>
   <div class="facts"><span><b>${T.paidN}</b> paid</span><span><b>${T.dueN}</b> still to pay${T.due?` · <span class="num">${esc(money(T.due))}</span>`:''}</span>${m!==CUR?`<button class="link" style="color:inherit;padding:0;min-height:0" data-act="m-today">Back to this month</button>`:''}</div></section>`;
  if(!S.props.length) return h+emptyProps();

        else if(st&&st[0]==='part')btn=`<button class="btn part" data-act="pay" data-t="${esc(t.id)}">Edit</button>`;

function drawBars(){
  const s=$('#bars');if(!s)return;
  const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const rows=yearMonths(S.year).map(m=>({m,...totals(m)}));
  const maxV=Math.max(1,...rows.map(r=>Math.max(r.exp,r.got)));
  const narrow=W<520,L=narrow?6:60,R=6,T=10,B=26,iw=W-L-R,ih=H-T-B,bw=iw/12;
  let g='';
  if(!narrow)for(const f of [0.5,1]){const yy=T+ih-ih*f;g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${esc(moneyS(maxV*f))}</text>`}
  g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}"/>`;
  rows.forEach((r,i)=>{const x=L+i*bw+bw*.16,w=bw*.68,he=ih*r.exp/maxV,hg=ih*Math.min(r.got,maxV)/maxV;
    const sel=S.selM===r.m;
    g+=`<g data-i="${i}" style="cursor:pointer"><rect x="${L+i*bw}" y="${T}" width="${bw}" height="${ih+B}" fill="transparent"/>
    <rect class="b-exp" x="${x}" y="${T+ih-he}" width="${w}" height="${he}" rx="3"/><rect class="${sel?'b-sel':'b-got'}" x="${x+w*.18}" y="${T+ih-hg}" width="${w*.64}" height="${hg}" rx="2"/>
    <text x="${x+w/2}" y="${H-8}" text-anchor="middle" style="${r.m===CUR?'font-weight:700;fill:var(--ink)':''}">${esc(narrow?mName(r.m,{month:'narrow'}):mName(r.m,{month:'short'}))}</text></g>`});
  s.innerHTML=g;
}

/* The page can stay open across midnight or the 1st of a month: recompute today's date when it changes. */
function tick(){
  const n=new Date(),c=`${n.getFullYear()}-${pad(n.getMonth()+1)}`,td=`${c}-${pad(n.getDate())}`;
  if(td===TODAY)return false;
  const oldCur=CUR;now=n;CUR=c;TODAY=td;if(S.month===oldCur)S.month=CUR;
  const el=$('#today');if(el)el.textContent=new Intl.DateTimeFormat(LOC,{weekday:'long',day:'numeric',month:'long'}).format(now);
  return true;
}
const revoked=()=>Object.values(S.errs).includes('revoked');

  tick();
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.view?'page':'false'));
  if(ro){ro.disconnect();ro=null}
  if(S.status==='nodb'){app.innerHTML=`<section class="card empty">${artNoBuildings}<h3>Can't open saved data here</h3><p>Open this page on claude.ai while signed in to see and save rent.</p></section>`;return}
  if(S.status==='error'){app.innerHTML=revoked()?`<section class="card empty">${artNoBuildings}<h3>This rent book can't be opened here right now.</h3></section>`
    :`<section class="card empty">${artNoBuildings}<h3>Couldn't open your rent book. Nothing is lost.</h3><p>Check that the phone is online, then try again.</p><button class="btn pri wide" data-act="retry-load">Try again</button></section>`;return}
  if(S.status==='loading'){app.innerHTML=`<section class="card empty">${artNoBuildings}<h3>Opening your rent book…</h3>${S.slow?'<p>It is taking a while. Check that the phone is online.</p>':''}</section>`;return}
  const v={month:vMonth,buildings:vProps,summary:vSummary,options:vSettings}[S.view]||vMonth;
  const stale=Object.keys(S.errs).length?`<div class="banner"><span>Numbers may be out of date.</span>${revoked()?'':'<button class="link" data-act="retry-load">Try again</button>'}</div>`
    :(S.slow?'<div class="banner">Numbers may be out of date. Check that the phone is online.</div>':'');
  const pend=S.pendingLong&&S.inflight>0?'<div class="banner" id="pending" role="status">Not saved yet: waiting for the internet. Keep this page open.</div>':'';
  app.innerHTML=pend+stale+v();
  if(S.view==='summary'){const s=$('#bars');if(s){ro=new ResizeObserver(drawBars);ro.observe(s);if(S.selM&&S.selM.startsWith(String(S.year)))showDetail(Number(S.selM.slice(5))-1)}}
}

/* ---------- sheets ---------- */
let onSub=null;
function sheet(title,body,submitLabel,fn,after){
  shwrap.innerHTML=`<form class="sheet-in" id="sf" novalidate><div class="sh-head"><h2>${esc(title)}</h2><button type="button" class="x" data-act="close" aria-label="Close">×</button></div>${body}<div class="sh-actions"><button type="submit" class="btn pri wide">${esc(submitLabel)}</button><div id="shx" style="display:grid;gap:10px"></div><button type="button" class="btn wide" data-act="close">Cancel</button></div></form>`;
  shwrap.hidden=false;document.body.classList.add('noscroll');onSub=fn;
  const f=$('#sf');
  /* Only close the form that was saved: a slow save must never close a newer form the user opened meanwhile. */
  f.onsubmit=async e=>{e.preventDefault();if(f.dataset.gone){if(shwrap.contains(f))closeSheet();return}const fd=Object.fromEntries(new FormData(f));const b=f.querySelector('[type=submit]');b.disabled=true;let ok=false;try{ok=await fn(fd,f)}finally{b.disabled=false}if(ok!==false&&shwrap.contains(f))closeSheet()};
  if(after)after(f);
  const first=f.querySelector('input:not([type=radio]),select');if(first&&matchMedia('(hover:hover)').matches)first.focus();
}
function closeSheet(){shwrap.hidden=true;shwrap.innerHTML='';document.body.classList.remove('noscroll');onSub=null}
function err(f,msg){if(!f||!f.isConnected){toast(msg);return false}let e=f.querySelector('.ferr');if(!e){e=document.createElement('p');e.className='ferr st-over';e.style.fontWeight='700';e.setAttribute('role','alert');f.querySelector('.sh-actions').before(e)}e.textContent=msg;return false}
const cap=s=>String(s).charAt(0).toUpperCase()+String(s).slice(1);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const alive=x=>x&&!x.deleted?x:null;
/* Every write carries when it was made and (when known) who made it. Only the user id is stored, never a name. */
const stamp=o=>({...o,at:new Date().toISOString(),...(S.me?{by:S.me}:{})});
function withTimeout(p,ms){let t;return Promise.race([p,new Promise((_,rej)=>{t=setTimeout(()=>rej({code:'timeout'}),ms)})]).finally(()=>clearTimeout(t))}
/* The name to show when a form's subject disappeared: the building if that went, otherwise the tenant. */
const goneName=t=>{const tr=S.raw.tenants[t.id];if(tr&&!tr.deleted){const pr=S.raw.props[t.propertyId];if(!pr||pr.deleted)return (pr&&pr.name)||'The building'}return t.name};
const tenantGone=t=>{const r=S.raw.tenants[t.id];return !r||r.deleted||!S.tenants.some(x=>x.id===t.id)};
function gone(f,name){
  const msg=`${name} was deleted on another phone. Nothing was changed.`;
  if(f&&shwrap.contains(f)){err(f,msg);f.dataset.gone='1';const b=f.querySelector('[type=submit]');if(b)b.textContent='OK';
    setTimeout(()=>f.addEventListener('click',()=>{if(shwrap.contains(f))closeSheet()},{once:true}),0)}
  else toast(msg);
  return false;
}

/* Writes in flight. Counted on the real write, so a write that outlives its 15 s timer still counts until it lands. */
let pendT=null;
/* hold() counts one unit of work in flight; its release(good,o) uncounts it once. With o, the last release toasts the outcome. */
function hold(){
  S.inflight++;let done=false;
  if(!pendT&&!S.pendingLong)pendT=setTimeout(()=>{pendT=null;if(S.inflight>0){S.pendingLong=true;render()}},5000);
  return (good,o)=>{if(done)return;done=true;S.inflight=Math.max(0,S.inflight-1);if(S.inflight===0){clearTimeout(pendT);pendT=null;
    if(S.pendingLong){S.pendingLong=false;render();if(o)toast(good?'Saved':`Couldn't ${o.verb||'save'} ${o.who||'this change'}. Check the internet and try again.`)}}};
}
function track(p,o){const rel=hold();p.then(()=>rel(true,o),()=>rel(false,o))}
const KNOWN=['invalid_argument','resource_exhausted','quota_exceeded','revoked','timeout','not_granted','capability_disabled','capability_removed'];
/* save(fn, okToast, {f, who, path, gname, verb, done, undo}): one write with a 15 s limit, one retry for passing trouble,
   and a plain message in the form (or a toast when there is no form) that names whose data it was. */
async function save(fn,ok='Saved',o={}){
  for(let tries=0;;tries++){
    const real=Promise.resolve().then(fn);track(real,o);
    /* o.t0: when the user tapped Save, so a fresh read before the write still fits in the same 15 s. */
    const lim=tries===0&&o.t0?Math.max(4000,o.t0+15000-Date.now()):15000;
    try{await withTimeout(real,lim);if(ok)toast(ok,o.undo?{undo:o.undo}:{});return true}
    catch(e){
      let code=e&&e.code;if(code==='transform_error')code='invalid_argument';
      if(code==='timeout')real.then(()=>{const x=o.f&&shwrap.contains(o.f)&&o.f.querySelector('.ferr');if(x)x.textContent='Now saved. You can close this.'},()=>{});
      if(tries===0&&code==='resource_exhausted'){await sleep(3000);continue}
      if(tries===0&&(code==='unavailable'||!KNOWN.includes(code))){await sleep(800+Math.random()*1200);continue}
      return failSave(code,o);
    }
  }
}
async function failSave(code,o){
  const who=o.who||'this change',f=o.f,verb=o.verb||'save';
  const say=msg=>{if(f&&shwrap.contains(f))return err(f,msg);toast(msg);return false};
  const goRO=msg=>{S.readOnly=true;closeSheet();render();toast(msg);return false};
  if(code==='timeout')return say(`${cap(who)} is not ${o.done||'saved'} yet. The phone seems offline. ${f?'Tap Save again':'Try again'} when it's back.`);
  if(code==='quota_exceeded')return say('The rent book is full. Nothing new can be saved.');
  if(['revoked','not_granted','capability_disabled','capability_removed'].includes(code))return goRO("This rent book can't be changed right now.");
  if(code==='invalid_argument'){
    if(S.canWrite===false)return goRO("You don't have permission to change this.");
    if(o.path){let d=null;try{d=await withTimeout(S.db.doc(o.path).get(),6000)}catch(e){}
      if(d&&(!d.exists||(d.data()||{}).deleted))return gone(f,o.gname||who)}
    if(S.canWrite===null)return goRO("You don't have permission to change this.");
  }
  return say(`Couldn't ${verb} ${who}. Check the internet and ${f?'tap Save again':'try again'}.`);
}
const field=(label,name,val='',type='text',extra='')=>`<label class="f">${label}<input id="f-${name}" name="${name}" type="${type}" value="${esc(val)}" ${extra}></label>`;
const rupeeField=(label,name,val='')=>`<label class="f">${label}<span class="rs"><input id="f-${name}" name="${name}" type="text" inputmode="numeric" autocomplete="off" value="${esc(val)}" placeholder="0"></span></label>`;

/* Shown inside the payment form when the other phone saved (or removed) this month's payment after the form opened. */
function askConflict(f,cur,mine,write){
  f.querySelector('.ferr')?.remove();f.querySelector('#ask')?.remove();
  const box=document.createElement('div');box.className='banner ask';box.id='ask';box.setAttribute('role','alert');
  const btn=(c,label)=>`<button type="button" class="btn wide" data-c="${c}">${esc(label)}</button>`;
  if(cur){const x=Number(cur.amount)||0,d=dShort(cur.paidOn);
    box.innerHTML=`<span><b>Already saved on another phone: <span class="num">${esc(money(x))}</span>${d?`, received ${esc(d)}`:''}.</b></span>`
      +btn('add',`Add mine, total ${money(x+mine.amount)}`)+btn('mine',`Keep only mine, ${money(mine.amount)}`)+btn('keep',`Keep ${money(x)}, don't change`);
  }else box.innerHTML=`<span><b>This payment was removed on another phone.</b></span>`+btn('mine',`Save mine, ${money(mine.amount)}`)+btn('keep','Leave it removed');
  f.querySelector('.sh-actions').before(box);
  box.addEventListener('click',async ev=>{const b=ev.target.closest('[data-c]');if(!b)return;const c=b.dataset.c;
    if(c==='keep'){closeSheet();return}
    box.querySelectorAll('button').forEach(x=>x.disabled=true);
    const body=c==='add'?{amount:(Number(cur.amount)||0)+mine.amount,paidOn:[cur.paidOn||'',mine.paidOn].sort().pop(),note:[cur.note,mine.note].filter(Boolean).join(' + ').slice(0,120)}:mine;
    box.remove();
    if(await write(body)&&shwrap.contains(f))closeSheet();
  });
  return false;
}
function paySheet(tid,m){
  const t=S.tenants.find(x=>x.id===tid);if(!t)return;m=m||S.month;
  const id=`${t.id}_${m}`,ref=S.db.doc('pays/'+id);
  const p=payOf(t,m),e=rentFor(t,m),p0=S.raw.pays[id]||null;let myAt=null;
  const who=`${t.name}'s payment`;
  const defDate=p&&p.paidOn?p.paidOn:(m===CUR?TODAY:`${m}-01`);
  sheet(`${t.name}, ${mName(m)}`,`<p class="muted" style="margin:0">${esc(propName(t.propertyId))} · rent is <b class="num">${esc(money(e))}</b></p>
   ${rupeeField('Amount received','amount',p?p.amount:e)}
   ${field('Date received','paidOn',defDate,'date')}
   <label class="f">Note <small>(optional, e.g. cash, UPI, bank transfer)</small><input id="f-note" name="note" value="${esc(p&&p.note||'')}" maxlength="120"></label>`,
   p?'Save changes':'Save as paid',async(fd,f)=>{
     if(tenantGone(t))return gone(f,goneName(t));
     const amt=num(fd.amount);if(!(amt>0))return err(f,'Enter the amount received.');
     const rel=hold();try{return await payCheck(fd,f,amt)}finally{rel(true)}
   },
   ()=>{if(p)$('#shx').innerHTML=`<button type="button" class="btn warn wide" data-act="unpay" data-t="${esc(t.id)}" data-m="${m}">Not paid, remove this entry</button>`});
  async function payCheck(fd,f,amt){
     const t0=Date.now();
     const mine={amount:amt,paidOn:fd.paidOn||TODAY,note:String(fd.note||'').slice(0,120)};
     const write=(v,tt)=>{const body={tenantId:t.id,propertyId:t.propertyId,month:m,amount:v.amount,paidOn:v.paidOn,note:v.note,at:myAt=new Date().toISOString(),...(S.me?{by:S.me}:{}),...(t.sample?{sample:true}:{})};
       return save(()=>ref.set(body),v.amount>=e?'Marked as paid':'Saved as part payment',{f,who,t0:tt})};
     /* Read the saved copy fresh and compare it with the copy this form opened with. */
     let cur;try{const s=await withTimeout(ref.get(),6000);cur=s.exists?s.data():null}catch(x){cur=S.raw.pays[id]||null}
     if(!shwrap.contains(f))return false;
     const a=alive(cur),b=alive(p0);
     const mineEarlier=a&&myAt&&a.at===myAt;
     const differs=!!a!==!!b||(a&&(Number(a.amount)!==Number(b.amount)||(a.paidOn||'')!==(b.paidOn||'')||(a.note||'')!==(b.note||'')||(a.at||null)!==(b.at||null)));
     if(mineEarlier||!differs)return write(mine,t0);
     if(a&&Number(a.amount)===amt){toast('Already saved on the other phone');return true}
     return askConflict(f,a,mine,write);
  }
}
function propSheet(p){
  sheet(p?'Edit building':'New building',`${field('Name','name',p?p.name:'','text','placeholder="e.g. Main Road shops" maxlength="80"')}
  <div class="f" style="margin-top:14px;font-weight:700">What kind of building?</div>
  <div class="seg"><label><input type="radio" name="type" value="business" ${p&&p.type==='business'?'checked':''}>${shopArt()}<span>Business</span></label><label><input type="radio" name="type" value="family" ${!p||p.type!=='business'?'checked':''}>${homeArt()}<span>Family home</span></label></div>
  <label class="f">Address or note <small>(optional)</small><input id="f-address" name="address" value="${esc(p&&p.address||'')}" maxlength="160"></label>`,
  p?'Save changes':'Add building',async(fd,f)=>{
    const name=String(fd.name||'').trim();if(!name)return err(f,'Give the building a name.');
    const v={name:name.slice(0,80),type:fd.type==='business'?'business':'family',address:String(fd.address||'').slice(0,160)};
    if(p){const r=S.raw.props[p.id];if(!r||r.deleted)return gone(f,p.name);
      return save(()=>S.db.doc('props/'+p.id).update(v),'Saved',{f,who:`${p.name}'s details`,path:'props/'+p.id,gname:p.name})}
    const ref=S.db.collection('props').doc();
    const ok=await save(()=>ref.set({...v,createdAt:TODAY}),'Building added',{f,who:name});
    if(ok){S.view='buildings';S.propId=ref.id;S.tenantId=null;history.replaceState(null,'','#buildings');if(S.props.some(x=>x.id===ref.id))render()}
    return ok;
  },()=>{if(p)$('#shx').innerHTML=`<button type="button" class="btn warn wide" data-act="del-prop">Delete this building</button>`});
}
function tenantSheet(t){
  const r0=t?rents(t)[0]:null,t0=t?S.raw.tenants[t.id]:null;
  sheet(t?'Edit tenant':`New tenant in ${propName(S.propId)}`,`${field('Tenant name','name',t?t.name:'','text','maxlength="80" autocomplete="off"')}
  ${field('Phone <small>(optional)</small>','phone',t?t.phone:'','tel','maxlength="30"')}
  ${field('Moved in on','start',t?t.start:TODAY,'date')}
  ${rupeeField('Monthly rent when they moved in','rent',r0?r0.amount:'')}
  ${t?'<p class="hint">For a new rent amount, use Add rent hike instead.</p>':''}
  ${field('Moved out on <small>(leave empty if still there)</small>','end',t?t.end:'','date')}
  <label class="f">Notes <small>(optional)</small><textarea id="f-notes" name="notes" rows="2" maxlength="500">${esc(t&&t.notes||'')}</textarea></label>`,
  t?'Save changes':'Add tenant',async(fd,f)=>{
    const name=String(fd.name||'').trim(),rent=num(fd.rent);
    if(!name)return err(f,'Enter the tenant name.');
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fd.start||''))return err(f,'Enter the move-in date.');
    if(!(rent>0))return err(f,'Enter the monthly rent.');
    if(fd.end&&fd.end<fd.start)return err(f,'Move-out date is before move-in date.');
    const sm=fd.start.slice(0,7);
    const v={name:name.slice(0,80),phone:String(fd.phone||'').slice(0,30),start:fd.start,end:fd.end||'',notes:String(fd.notes||'').slice(0,500)};
    if(!t){const ref=S.db.collection('tenants').doc();
      const ok=await save(()=>ref.set({propertyId:S.propId,...v,rents:[{from:sm,amount:rent}]}),'Tenant added',{f,who:name});
      if(ok)S.tenantId=null;return ok}
    if(tenantGone(t))return gone(f,goneName(t));
    /* Only the fields this person changed are written, so a hike or move-out saved on the other phone survives. */
    const base=t0||t,ch={};
    for(const k of Object.keys(v))if(String(base[k]??'')!==v[k])ch[k]=v[k];
    const old=rents(base),first=old[0];
    if(v.start!==String(base.start??'')&&old.length>1&&sm>=old[1].from)return err(f,`The move-in date is after the rent hike from ${mName(old[1].from)}. Remove that hike first, or pick an earlier date.`);
    if(!first||first.from!==sm||Number(first.amount)!==rent){ch['rent_'+sm]=stamp({amount:rent});if(first&&first.from!==sm)ch['rent_'+first.from]=null}
    if(!Object.keys(ch).length){toast('No changes');return true}
    return save(()=>S.db.doc('tenants/'+t.id).update(ch),'Saved',{f,who:`${t.name}'s details`,path:'tenants/'+t.id,gname:t.name});
  },()=>{if(t)$('#shx').innerHTML=`<button type="button" class="btn warn wide" data-act="del-tenant">Delete this tenant and their payments</button>`});
}
function hikeSheet(t){
  const cur=rentAt(t,CUR),nm=addM(CUR,1);
  sheet(`Rent hike for ${t.name}`,`<p class="muted" style="margin:0">Rent now: <b class="num">${esc(money(cur))}</b></p>
  ${rupeeField('New monthly rent','amount','')}<p class="hint" id="hk"></p>
  ${field('Starts from month','from',nm,'month')}
  <label class="f">Note <small>(optional)</small><input id="f-hnote" name="note" maxlength="80" placeholder="e.g. yearly 5% increase"></label>`,
  'Save rent hike',async(fd,f)=>{
    const amt=num(fd.amount),from=String(fd.from||'');
    if(!(amt>0))return err(f,'Enter the new rent.');
    if(!/^\d{4}-\d{2}$/.test(from))return err(f,'Pick the month the new rent starts.');
    if(from<=startM(t))return err(f,'The hike must start after the tenant moved in.');
    if(tenantGone(t))return gone(f,goneName(t));
    /* Each hike is its own key, so two hikes saved at once on two phones both stay. */
    return save(()=>S.db.doc('tenants/'+t.id).update({['rent_'+from]:stamp({amount:amt,note:String(fd.note||'').slice(0,80)})}),'Rent hike saved',{f,who:`${t.name}'s rent hike`,path:'tenants/'+t.id,gname:t.name});
  },f=>{const a=f.querySelector('[name=amount]'),hk=$('#hk');a.addEventListener('input',()=>{const v=num(a.value);hk.textContent=v>0&&cur?`That is ${v>=cur?'up':'down'} ${money(Math.abs(v-cur))} (${Math.abs(Math.round((v-cur)/cur*1000)/10)}%)`:''})});
}
function moveSheet(t){
  sheet(`${t.name} moved out`,`${field('Last day','end',TODAY,'date')}<p class="hint">Rent stops being expected after this month. Past payments stay saved.</p>`,'Save',async(fd,f)=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(fd.end||''))return err(f,'Pick the date.');
    if(fd.end<t.start)return err(f,'That is before they moved in.');
    if(tenantGone(t))return gone(f,goneName(t));
    return save(()=>S.db.doc('tenants/'+t.id).update({end:fd.end}),'Saved',{f,who:`${t.name}'s move-out date`,path:'tenants/'+t.id,gname:t.name});
  });
}

/* ---------- deletes ---------- */
/* A delete marks the one document deleted:true (one write), with Undo for 8 s. Tenants and payments under it are hidden by derive(). */
function softDelete(path,name,okMsg){
  const ref=S.db.doc(path);
  return save(()=>ref.update(stamp({deleted:true})),okMsg,{who:name,verb:'delete',done:'deleted',path,gname:name,
    undo:()=>save(()=>ref.update({deleted:false}),`${name} is back`,{who:name,verb:'bring back',done:'back'})});
}
function armed(b,label){if(b.dataset.armed)return true;const orig=b.textContent;b.dataset.armed='1';b.textContent=label;setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=orig}},6000);return false}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  const tabB=ev.target.closest('nav.tabs button');
  if(tabB){go(tabB.dataset.tab);return}
  const g=ev.target.closest('#bars g[data-i]');if(g){showDetail(Number(g.dataset.i));return}
  if(ev.target===shwrap){closeSheet();return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,t=S.tenants.find(x=>x.id===(b.dataset.t||S.tenantId)),p=S.props.find(x=>x.id===S.propId);
  switch(a){
    case 'close':closeSheet();break;
    case 'tab':go(b.dataset.t);break;
    case 'm-prev':S.month=addM(S.month,-1);render();break;
    case 'm-next':S.month=addM(S.month,1);render();break;
    case 'm-today':S.month=CUR;render();break;
    case 'y-prev':S.year--;S.selM=null;render();break;
    case 'y-next':S.year++;S.selM=null;render();break;
    case 'pay':if(canAct())paySheet(b.dataset.t,b.dataset.m);break;
    case 'unpay':{const m=b.dataset.m,ref=S.db.doc(`pays/${b.dataset.t}_${m}`),f=$('#sf'),who=`${t?t.name:'This tenant'}'s ${mName(m)} payment`;
      const ok=await save(async()=>{try{await ref.update(stamp({deleted:true}))}catch(e){if(e&&e.code==='invalid_argument'){const s=await ref.get().catch(()=>null);if(s&&!s.exists)return}throw e}},
        `${cap(who)} removed`,{f,who,verb:'remove',done:'removed',undo:()=>save(()=>ref.update({deleted:false}),`${cap(who)} is back`,{who,verb:'bring back',done:'back'})});
      if(ok&&f&&shwrap.contains(f))closeSheet();break}
    case 'add-prop':propSheet();break;
    case 'open-prop':S.propId=b.dataset.p;S.tenantId=null;render();scrollTo(0,0);break;
    case 'back-props':S.propId=null;render();break;
    case 'back-prop':S.tenantId=null;render();break;
    case 'edit-prop':if(p)propSheet(p);break;
    case 'del-prop':if(p&&armed(b,'Tap again to delete everything in it')){closeSheet();if(await softDelete('props/'+p.id,p.name,`${p.name} deleted`)){S.propId=null;render()}}break;
    case 'add-tenant':tenantSheet();break;
    case 'open-tenant':S.tenantId=b.dataset.t;render();scrollTo(0,0);break;
    case 'goto-tenant':if(t){S.view='buildings';S.propId=t.propertyId;S.tenantId=t.id;history.replaceState(null,'','#buildings');render();scrollTo(0,0)}break;
    case 'edit-tenant':if(t)tenantSheet(t);break;
    case 'del-tenant':if(t&&armed(b,'Tap again to delete')){closeSheet();if(await softDelete('tenants/'+t.id,t.name,`${t.name} deleted`)){S.tenantId=null;render()}}break;
    case 'hike':if(t)hikeSheet(t);break;
    case 'moveout':if(t)moveSheet(t);break;
    case 'del-hike':if(t&&armed(b,'Tap again')){const from=b.dataset.f;save(()=>S.db.doc('tenants/'+t.id).update({['rent_'+from]:null}),'Hike removed',{who:`${t.name}'s rent hike`,verb:'remove',done:'removed',path:'tenants/'+t.id,gname:t.name})}break;
    case 'clear-sample':if(armed(b,'Tap again to remove')){
      /* Sample buildings that real tenants were added to are kept, with those tenants (their sample mark is cleared so the banner goes). Only sample:true documents are removed. */
      const R=S.raw,keepP=new Set(Object.values(R.tenants).filter(x=>!x.sample&&!x.deleted).map(x=>x.propertyId));
      await save(async()=>{for(const x of Object.values(R.pays).filter(x=>x.sample))await S.db.doc('pays/'+x.id).delete();for(const x of Object.values(R.tenants).filter(x=>x.sample))await S.db.doc('tenants/'+x.id).delete();for(const x of Object.values(R.props).filter(x=>x.sample))await(keepP.has(x.id)?S.db.doc('props/'+x.id).update({sample:false}):S.db.doc('props/'+x.id).delete())},'Sample data removed',{who:'the sample data',verb:'remove',done:'removed'});
      S.propId=S.tenantId=null;render()}break;
    case 'retry-load':retryLoad();break;
    case 'copy':{const R=S.raw,data=JSON.stringify({currency:'INR',buildings:Object.values(R.props),tenants:Object.values(R.tenants),payments:Object.values(R.pays)},null,1);try{await navigator.clipboard.writeText(data);toast('Copied. Paste it somewhere safe.')}catch(e){toast("This phone wouldn't allow copying.")}}break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!shwrap.hidden)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='hidden'&&tick())render()});
function go(v){if(!VIEWS.includes(v))v='month';if(v==='buildings'){S.propId=S.tenantId=null}S.view=v;if(location.hash.slice(1)!==v)history.replaceState(null,'','#'+v);render();scrollTo(0,0)}
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==S.view){S.view=v;render()}});
{const v=location.hash.slice(1);if(VIEWS.includes(v))S.view=v}

/* ---------- data ---------- */
let slowT=setTimeout(()=>{S.slow=true;render()},10000);
const fresh={};
const KEYS=['props','tenants','pays','settings'];
/* Build what the screens show from S.raw: deleted documents, tenants of a deleted building and their payments are left out. */
function derive(){
  const R=S.raw;
  S.props=Object.values(R.props).filter(p=>!p.deleted).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  const pids=new Set(S.props.map(p=>p.id)),live=Object.values(R.tenants).filter(t=>!t.deleted);
  S.tenants=live.filter(t=>pids.has(t.propertyId));
  S.hiddenN=live.length-S.tenants.length;
  const tids=new Set(S.tenants.map(t=>t.id)),o={};
  for(const p of Object.values(R.pays))if(!p.deleted&&tids.has(p.tenantId))o[p.id]=p;
  S.pays=o;
}
function ready(){if(S.status!=='error'&&KEYS.every(k=>S.got[k]))S.status='ok'}
function settle(key,cache){S.got[key]=1;if(!cache)fresh[key]=1;if(KEYS.every(k=>fresh[k])){clearTimeout(slowT);S.slow=false}ready();render()}
const SRC={props:()=>S.db.collection('props'),tenants:()=>S.db.collection('tenants'),pays:()=>S.db.collection('pays'),settings:()=>S.db.doc('settings/app')};
function sub(key){
  const next=snap=>{
    if(key==='settings')S.settings=snap.exists?snap.data():null;
    else{const o={};for(const d of snap.docs)o[d.id]={...d.data(),id:d.id};S.raw[key]=o;derive()}
    settle(key,!!(snap.metadata&&snap.metadata.fromCache))};
  const fail=e=>{const code=(e&&e.code)||'unavailable';S.errs[key]=code;S.unsub[key]=null;clearTimeout(slowT);S.slow=false;
    if(code==='revoked')S.readOnly=true;if(!S.got[key])S.status='error';render()};
  try{S.unsub[key]=SRC[key]().onSnapshot(next,fail)}catch(e){fail(e)}
}
function retryLoad(){
  const ks=Object.keys(S.errs).filter(k=>S.errs[k]!=='revoked');if(!ks.length)return;
  for(const k of ks){try{if(S.unsub[k])S.unsub[k]()}catch(e){}delete S.errs[k]}
  if(S.status==='error'&&!Object.keys(S.errs).length){S.status='loading';clearTimeout(slowT);slowT=setTimeout(()=>{S.slow=true;render()},10000)}
  for(const k of ks)sub(k);
  ready();render();
}
claude.use('db').then(async db=>{
  if(!db){clearTimeout(slowT);S.status='nodb';render();return}
  S.db=db;
  for(const k of KEYS)sub(k);
  try{const u=await claude.use('user');if(u){
    const c=typeof u.can==='function'?await u.can('data.write'):null;S.canWrite=c===true||c===false?c:null;
    if(c===false){S.readOnly=true;render()}
    try{S.me=typeof u.id==='function'?(await u.id())||null:null}catch(e){S.me=null}}}catch(e){}
});
render();
}
</script>
